server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = /km {
        return 301 /km/;
    }

    location = /km/CONTEXT.md { return 404; }
    location = /km/docs { return 404; }
    location ^~ /km/docs/ { return 404; }
    location = /km/tests { return 404; }
    location ^~ /km/tests/ { return 404; }

    # Public browser settings, mounted read-only; never store secrets here.
    location = /km/config.ini {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /km/ {
        try_files $uri $uri/ =404;
    }

    location / { return 404; }
}
