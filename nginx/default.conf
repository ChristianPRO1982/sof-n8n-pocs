server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /n8n {
        return 301 /n8n/;
    }

    location /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Documents produits par le workflow Taxon, disponibles en lecture seule.
    location ^~ /taxon/docs/ {
        alias /var/www/taxon-docs/;
        autoindex off;
    }

    location = /km {
        return 301 /km/;
    }

    # Contexte Codex et documentation de développement : accès HTTP interdit.
    location = /km/CONTEXT.md {
        return 404;
    }

    location = /km/docs {
        return 404;
    }

    location ^~ /km/docs/ {
        return 404;
    }

    location = /km/tests { return 404; }
    location ^~ /km/tests/ { return 404; }

    location /km/ {
        # Resolve again after km-front is recreated with a different container IP.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $km_front km-front:80;
        proxy_pass http://$km_front$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
