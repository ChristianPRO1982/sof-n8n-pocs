services:
  # PostgreSQL dedicated exclusively to n8n internal data:
  # workflows, credentials, executions, users and settings.
  postgres_n8n:
    image: postgres:16-alpine
    container_name: pg_n8n
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME}

    volumes:
      - n8n_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - n8n_database


  # PostgreSQL + pgvector dedicated to business data:
  # scraping results, chunks, metadata and embeddings.
  pgv:
    image: pgvector/pgvector:pg16
    container_name: pgv
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${PGV_USER:-n8n}
      POSTGRES_PASSWORD: ${PGV_PASSWORD:-n8n}
      POSTGRES_DB: ${PGV_DATABASE:-n8n}

    volumes:
      - pgv_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGV_USER:-n8n} -d ${PGV_DATABASE:-n8n}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - business_data


  n8n:
    image: docker.n8n.io/n8nio/n8n:2.25.7
    container_name: n8n
    restart: unless-stopped
    init: true

    depends_on:
      postgres_n8n:
        condition: service_healthy
      pgv:
        condition: service_healthy

    environment:
      # Runtime
      NODE_ENV: production
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris

      # Dedicated n8n PostgreSQL database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public

      # Credential encryption
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Public access through Nginx
      N8N_HOST: ${PUBLIC_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_PATH: /n8n/
      N8N_PROXY_HOPS: 1

      WEBHOOK_URL: http://${PUBLIC_HOST}/n8n/
      N8N_EDITOR_BASE_URL: http://${PUBLIC_HOST}/n8n/

      # Required while the POC is exposed through HTTP
      N8N_SECURE_COOKIE: "false"

      # Persistent files exchanged by workflows
      N8N_RESTRICT_FILE_ACCESS_TO: /files

      # Store execution binary data on disk instead of RAM
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/binaryData

      # Community nodes
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"

      # Enable all built-in nodes, including Execute Command
      NODES_EXCLUDE: "[]"

      # Prevent uncontrolled execution-history growth
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000

      # POC ergonomics
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"

    volumes:
      # Keeps encryption settings, community nodes and binary execution data
      - ./n8n_data:/home/node/.n8n

      # Files deliberately exchanged with workflows and FastAPI
      - ./n8n_files:/files

    expose:
      - "5678"

    networks:
      - frontend
      - n8n_database
      - business_data


  fastapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fastapi
    restart: unless-stopped
    init: true

    environment:
      TZ: Europe/Paris

      # pgvector connection information, available to FastAPI if needed
      PGVECTOR_HOST: pgv
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: ${PGV_DATABASE:-n8n}
      PGVECTOR_USER: ${PGV_USER:-n8n}
      PGVECTOR_PASSWORD: ${PGV_PASSWORD:-n8n}

    volumes:
      - ./n8n_files:/app/n8n_files

    expose:
      - "8000"

    depends_on:
      pgv:
        condition: service_healthy

    networks:
      - frontend
      - business_data


  # Standalone KM frontend; shares only the existing HTTP network.
  km-front:
    image: christianpro1982/km:${KM_IMAGE_TAG:-latest}
    restart: unless-stopped

    volumes:
      - type: bind
        source: ./UI_chat/km/config.ini
        target: /usr/share/nginx/html/km/config.ini
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./UI_chat/km/statuses.json
        target: /usr/share/nginx/html/km/statuses.json
        read_only: true
        bind:
          create_host_path: false

    networks:
      - frontend


  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx_front

    container_name: nginx_front
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - fastapi
      - n8n

    volumes:
      - ./n8n_files/taxon/docs:/var/www/taxon-docs:ro

    networks:
      - frontend


volumes:
  # Internal n8n PostgreSQL data
  n8n_db_data:

  # Business and vector data
  pgv_data:


networks:
  # Nginx, FastAPI and n8n HTTP communication
  frontend:
    driver: bridge

  # Private communication between n8n and its internal database
  n8n_database:
    driver: bridge
    internal: true

  # Private communication with the pgvector database
  business_data:
    driver: bridge
    internal: true
